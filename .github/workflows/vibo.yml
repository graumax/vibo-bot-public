name: VIBO Wohnungsbot (public)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vibo-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Anzeigen prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python vibo_watcher.py

      - name: Stand speichern (nur bei Änderungen)
        run: |
          git config user.name "vibo-bot"
          git config user.email "vibo-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Anzeigen-Stand aktualisiert" && git push)
